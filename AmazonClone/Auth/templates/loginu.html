{% extends 'base.html' %}

<title>{% block title%}Login Page{% endblock %}</title>

{% block content %}

<div class="container">
    
    <div class="login-form w-50 m-auto">
    <h2 style="text-align: center; color: red;">{{error}}</h2>
    <h3 class="text-center mb-4 text-danger">Login</h3>
    <br>
    <br>
    
    <form method="POST">
       {% csrf_token %}

      <div class="form-group">
        <label >User Name</label>
        <input type="text" class="form-control"  placeholder="Enter username" required name="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required name="password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Login</button>
        <div class="signup-link">
        <small>Don't have an account? <a href="#">Create New Account</a></small>
      </div>
    </form>
  </div>

</div>

{% endblock %}
