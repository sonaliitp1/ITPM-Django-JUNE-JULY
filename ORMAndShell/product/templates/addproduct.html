{% extends 'base.html' %}
{% block content %}
<div class="w-50 m-auto p-3 mt-3">
<form action="{% url 'add' %}" method="POST">
    {% csrf_token %}

    <div class="mb-3">
    <label  class="form-label">Product Id</label>
    <input type="number" class="form-control" placeholder="enter product id" name="pid">
    </div>

     <div class="mb-3">
    <label  class="form-label">Product Name</label>
    <input type="text" class="form-control" placeholder="enter product name" name="pname">
    </div>

     <div class="mb-3">
    <label  class="form-label">Category</label>
    <input type="text" class="form-control" placeholder="enter category" name="category">
    </div>

     <div class="mb-3">
    <label  class="form-label">Stock</label>
    <input type="number" class="form-control" placeholder="enter stock" name="stock">
    </div>

    <div>
        <input type="submit" class="btn btn-success" value="Add new product">
    </div>


</form>
</div>



{% endblock %}
